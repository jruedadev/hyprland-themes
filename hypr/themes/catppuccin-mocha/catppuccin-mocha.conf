source = ~/.config/hypr/colors/catppuccin-mocha.conf

# Apply themes
exec = sh ~/.config/hypr/scripts/switch-theme.sh catppuccin-mocha

general {
    gaps_in = 10
    gaps_out = 20

    border_size = 4
    col.active_border = $blue
    col.inactive_border = $bg4

    layout = dwindle

    resize_on_border = true
}

decoration {
    rounding = 10

    blur {
        enabled = no
    }
    shadow {
        enabled = true
        range = 0
        render_power = 4
        color = rgb(45475a)
        color_inactive = rgb(6c7086)
        scale = 1.0
        offset = 0 10
    }

    dim_inactive = false
    dim_strength = 0.1

    dim_around = 0.0
}

animations {
    enabled = yes

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = myBezier2, 0.65, 0, 0.35, 1
    bezier = linear, 0, 0, 1, 1

    bezier=slow,0,0.85,0.3,1
    bezier=overshot,0.7,0.6,0.1,1.1
    bezier=bounce,1,1.6,0.1,0.85
    bezier=slingshot,1,-1,0.15,1.25
    bezier=nice,0,6.9,0.5,-4.20

    animation = windows,1,5,bounce,popin
    animation = border,1,20,default
    animation = fade, 1, 5, overshot
    animation = workspaces, 1, 6, overshot, slidevert
    animation = windowsIn,1,5,slow,popin
    animation = windowsMove,1,5,default
}

dwindle {
    preserve_split = yes
}

group {
    col.border_inactive = $fg
    col.border_active = $bg4
}

$mainMod = SUPER

# Wofi menus
bind = $mainMod, D, exec, pkill wofi || wofi --show drun --term=kitty --width=35% --height=50% --columns 1 -I -s ~/.config/wofi/themes/catppuccin-mocha.css -o $MAIN_DISPLAY
bind = $mainMod, B, exec, pkill wofi || sh ~/.config/wofi/scripts/powermenu.sh "catppuccin-mocha" "--height=17% -o $MAIN_DISPLAY"
bind = $mainMod, C, exec, pkill wofi || sh ~/.config/wofi/scripts/wofi-calc.sh "catppuccin-mocha" "-o $MAIN_DISPLAY"
bind = $mainMod, V, exec, pkill wofi || cliphist list | wofi --dmenu -o $MAIN_DISPLAY -s ~/.config/wofi/themes/catppuccin-mocha.css| cliphist decode | wl-copy
bind = $mainMod, period, exec, pkill wofi || sh ~/.config/wofi/scripts/wofi-emoji.sh "catppuccin-mocha" "-o $MAIN_DISPLAY"

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e-1
bind = $mainMod, mouse_up, workspace, e+1

# Resize focused window with arrow keys, indicated with borders of a different color
bind = $mainMod, R, exec, hyprctl --batch keyword "general:col.active_border rgba(f38ba8ff);"
bind = $mainMod, R, exec, hyprctl --batch keyword "general:col.group_border_active rgba(f38ba8ff);"
bind = $mainMod, R, submap, resize
submap = resize
binde = , right, resizeactive, 15 0
binde = , left, resizeactive, -15 0
binde = , up, resizeactive, 0 -15
binde = , down, resizeactive, 0 15
bind = , escape, exec, hyprctl --batch keyword "general:col.active_border rgba(89b4faff);"
bind = , escape, exec, hyprctl --batch keyword "general:col.group_border_active rgba(6c7086ff);"
bind = , escape, submap, reset
submap = reset
